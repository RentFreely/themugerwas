<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dashboard — The Mugerwas</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="dashboard">
  <canvas id="fx-canvas" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="top-nav">
    <a class="brand" href="/">The Mugerwas</a>
    <nav><a href="/">Guest View</a></nav>
  </header>

  <main class="page-shell">
    <h1 class="page-title">Dashboard</h1>
    <p class="page-sub">Access by direct link only. Not shown in guest navigation.</p>
    <div id="dash-error" class="alert error hidden"></div>

    <section id="loginSection">
      <div class="field">
        <label for="adminEmail">Organizer Email</label>
        <input id="adminEmail" type="email" autocomplete="username" />
      </div>
      <div class="field">
        <label for="adminPass">Password</label>
        <input id="adminPass" type="password" autocomplete="current-password" />
      </div>
      <button id="loginBtn" class="btn btn-primary" type="button">Sign In</button>
    </section>

    <section id="dashSection" class="hidden">
      <div class="tools-row">
        <div class="field">
          <label for="searchInput">Search</label>
          <input id="searchInput" placeholder="Name, email, or phone" />
        </div>
        <button id="refreshBtn" class="btn" type="button">Refresh</button>
        <button id="csvBtn" class="btn" type="button">CSV</button>
        <button id="logoutBtn" class="btn" type="button">Logout</button>
      </div>

      <div class="kpis">
        <div class="kpi"><b id="kTotal">0</b><span>Total</span></div>
        <div class="kpi"><b id="kYes">0</b><span>Accept</span></div>
        <div class="kpi"><b id="kMaybe">0</b><span>Maybe</span></div>
        <div class="kpi"><b id="kNo">0</b><span>Declined</span></div>
        <div class="kpi"><b id="kSeats">0</b><span>Seats</span></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Seats</th><th>Meal</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="rsvpRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script src="/main.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
